name: Update Powerball results
on:
  schedule:
    - cron: "0 12 * * *"   # Daily at 12:00 UTC - Powerball draws Mon/Wed/Sat evenings ET, this comfortably catches each new result the next morning
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch Powerball results
        run: python scripts/fetch_powerball_results.py
      - name: Commit updated data
        run: |
          git config user.name "lottopickhub-bot"
          git config user.email "actions@github.com"
          git add data/powerball.json data/powerball-history.json
          git diff --staged --quiet || git commit -m "Update Powerball results"
          git push
