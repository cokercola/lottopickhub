name: Update Pick 3 - South Carolina
on:
  schedule:
    - cron: "45 17 * * *"  # ~12:45 PM ET, shortly after SC's midday draw
    - cron: "0 23 * * *"   # ~6:59 PM ET, shortly after SC's evening draw
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch SC Pick 3 results
        run: python scripts/fetch_pick3_results_sc.py
      - name: Commit updated data
        run: |
          git config user.name "lottopickhub-bot"
          git config user.email "actions@github.com"
          git add data/pick3/sc-history.json
          git diff --staged --quiet || git commit -m "Update SC Pick 3 results"
          git push
