name: Update Pick 4 - New York
on:
  schedule:
    - cron: "30 19 * * *"  # ~2:30 PM ET (approximate - not DST-corrected, same as Pick 3)
    - cron: "30 4 * * *"   # ~11:30 PM ET
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch NY Pick 4 results
        run: python scripts/fetch_pick4_results_ny.py
      - name: Commit updated data
        run: |
          git config user.name "lottopickhub-bot"
          git config user.email "actions@github.com"
          git add data/pick4/ny-history.json
          git diff --staged --quiet || git commit -m "Update NY Pick 4 results"
          git pull --rebase --autostash origin main
          git push
