name: Update Powerball jackpot info
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours - jackpot estimates update periodically, not tied to draw nights
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode: print parsed values without writing the output file"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 brotli
      - name: Fetch jackpot info
        run: |
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            python scripts/fetch_powerball_jackpot.py --debug
          else
            python scripts/fetch_powerball_jackpot.py
          fi
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "lottopickhub-bot"
          git config user.email "actions@github.com"
          [ -f data/powerball-jackpot.json ] && git add data/powerball-jackpot.json
          git diff --staged --quiet || git commit -m "Update Powerball jackpot info"
          git push
