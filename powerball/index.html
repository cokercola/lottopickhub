<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powerball Winning Numbers, Quick Pick &amp; Ticket Checker | LottoPickHub</title>
<meta name="description" content="Latest Powerball winning numbers, a free quick pick generator, ticket checker, and historical draw stats — updated daily.">
<link rel="canonical" href="https://lottopickhub.com/powerball/">
<link rel="icon" type="image/png" href="/assets/lottopickhub-icon.png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-shell">
<div class="card">

  <div class="game-pills">
    <span class="game-pills-label">Multi-state</span>
    <a href="/powerball/" class="game-pill active">Powerball</a>
    <span class="game-pill" style="opacity:0.5;">Mega Millions</span>
    <span class="game-pill" style="opacity:0.5;">Cash4Life</span>
    <span class="game-pill" style="opacity:0.5;">Lucky for Life</span>
  </div>

  <div class="breadcrumb"><a href="/">Home</a> / <span class="current">Powerball</span></div>

  <div class="section">
    <p class="section-sub" id="draw-date">Latest draw</p>
    <div class="ball-row" id="latest-draw-balls"></div>
  </div>

  <div class="section-divider"></div>

  <div class="section">
    <p class="section-label">Quick pick generator</p>
    <div class="ball-row" id="quick-pick-balls" style="margin-bottom:12px;"></div>
    <div class="quick-pick-actions">
      <button class="btn-gold" id="quick-pick-btn">Generate</button>
      <span class="fine-print">Fully random - not optimized picks</span>
    </div>
  </div>

  <div class="section-divider"></div>

  <div class="section">
    <p class="section-label">Did I win? Ticket checker</p>
    <form class="checker-row" id="checker-form">
      <input type="text" class="checker-input" id="checker-input" placeholder="e.g. 14 27 33 49 58 6">
      <button type="submit" class="btn-gold">Check</button>
    </form>
    <div class="checker-result" id="checker-result"></div>
  </div>

  <div class="section-divider"></div>

  <div class="section" id="stats-section"></div>

  <div class="footer-strip">
    <span>Historical curiosity and entertainment only — not a prediction tool.</span>
    <span>Data source: NY State Open Data (official)</span>
  </div>

</div>
</div>

<script src="/assets/site.js"></script>
<script src="/assets/header.js"></script>
<script>
async function init() {
  const data = await fetchPowerballData();
  renderLatestDraw('latest-draw-balls', 'draw-date', data);
  initQuickPick('quick-pick-balls', 'quick-pick-btn', data);
  initTicketChecker('checker-form', 'checker-input', 'checker-result', data);
  renderStats('stats-section', data);
}
init().catch(err => {
  console.error(err);
  document.getElementById('latest-draw-balls').textContent = 'Could not load results.';
});
</script>
</body>
</html>
